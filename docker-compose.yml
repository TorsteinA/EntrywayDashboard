services:
  dashboard:
    image: ghcr.io/<your-github-username>/<your-repo-name>:latest
    container_name: entry_dashboard
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      - LAT=59.9550
      - LON=11.0500
      - STOP_PLACE_ID=NSR:StopPlace:58211
      - USER_AGENT=MyEntryDashboard/1.0 (admin@local.home)
      - ET_CLIENT_NAME=myhome-entrykiosk
