<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gang-dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="dashboard-container">
      <!-- Overskrift -->
      <header class="header">
        <div class="clock-display">
          <div id="time" class="time">--:--</div>
          <div id="date" class="date">Laster dato...</div>
        </div>
        <div id="weather-summary-header" class="weather-summary-header">
          <span id="header-temp">--°C</span>
          <span id="header-condition">--</span>
        </div>
      </header>

      <main class="content-grid">
        <!-- Vær-seksjon -->
        <section class="card weather-card">
          <h2>Værvarsel</h2>
          <div class="current-weather">
            <div class="main-temp" id="current-temp">--°</div>
            <div class="details">
              <div id="condition-text" class="condition">Laster...</div>
              <div class="high-low">
                <span>Maks: <strong id="high-temp">--°</strong></span>
                <span>Min: <strong id="low-temp">--°</strong></span>
              </div>
            </div>
          </div>

          <h3>Neste 3 timer</h3>
          <div class="forecast-3h" id="forecast-3h">
            <div class="loading">Henter værvarsel...</div>
          </div>
        </section>

        <!-- Kollektiv-seksjon -->
        <section class="card transit-card">
          <div class="card-header">
            <h2>Neste avganger</h2>
            <span id="stop-name" class="stop-name">Busstopp</span>
          </div>
          <div id="transit-list" class="transit-list">
            <div class="loading">Laster avganger...</div>
          </div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
